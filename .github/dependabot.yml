# 2026-10 modernization: STAGING BRANCH ONLY until promotion.
# Keep production workflows unchanged; Dependabot activates when this file reaches default branch.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 3
    groups:
      maintenance-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
