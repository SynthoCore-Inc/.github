name: Agent (Codex on Azure OpenAI)

# Worker session on Azure Startups credits. Dispatch = a comment on the task issue
# starting with "@agent GO". An optional "model:" line anywhere in the comment
# selects a lane; default lane is codex (gpt-5-3-codex).
# Pushes to agent/issue-<N>-<UTC stamp>; never opens a PR (ga-runner auto-pr.sh does).

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: agent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  agent:
    if: >-
      startsWith(github.event.comment.body, '@agent GO') &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
       github.event.comment.user.login == 'synthocore-command-center-executor[bot]')
    runs-on: [self-hosted, linux, estate]
    timeout-minutes: 60
    env:
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      GO_COMMENT: ${{ github.event.comment.body }}
    steps:
      - name: Start job timer
        run: date +%s > "$RUNNER_TEMP/agent-started-at"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Codex CLI
        run: npm install -g @openai/codex@0.162.0  # pinned: 0.162 removed --full-auto; bump deliberately

      - name: Pick model lane
        id: lane
        run: |
          lane=$(printf '%s\n' "$GO_COMMENT" | sed -n 's/^[[:space:]]*model:[[:space:]]*\([^[:space:]]*\)[[:space:]]*$/\1/ip' | head -1 | tr '[:upper:]' '[:lower:]')
          case "$lane" in
            ''|codex) lane=codex; model=gpt-5-3-codex ;;
            sol) model=gpt-5-6-sol ;;
            sol61) model=gpt-6-1-sol ;;
            astra) model=gpt-6-astra ;;
            fast) model=gpt-5-4 ;;
            mini) model=gpt-5.4-mini ;;
            *) echo "Unsupported model lane: $lane" >&2; exit 1 ;;
          esac
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          # runner.temp is not available in job-level env (that made the file invalid) — set it here.
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"
          echo "branch=agent/issue-${ISSUE}-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Configure Codex for Azure OpenAI
        run: |
          mkdir -p "$CODEX_HOME"
          cat > "$CODEX_HOME/config.toml" <<EOF
          model = "${{ steps.lane.outputs.model }}"
          model_provider = "azure"
          approval_policy = "never"
          sandbox_mode = "workspace-write"
          model_reasoning_effort = "medium"

          [model_providers.azure]
          name = "Azure OpenAI (ais-synthocore-agents)"
          base_url = "${AZURE_OPENAI_ENDPOINT}/openai"
          env_key = "AZURE_OPENAI_API_KEY"
          query_params = { api-version = "2025-04-01-preview" }
          wire_api = "responses"
          EOF

      - name: Create session branch
        run: |
          git config user.name "synthocore-agent"
          git config user.email "agent@synthocore.ca"
          # AGENT_BRANCH_CONTINUE: "branch: agent/issue-N-YYYYMMDD-HHMM" in the GO comment continues that branch.
          base=$(printf '%s\n' "$GO_COMMENT" | sed -n 's#^branch:[[:space:]]*\(agent/issue-[0-9]\{1,6\}-[0-9]\{8\}-[0-9]\{4\}\)[[:space:]]*$#\1#p' | head -1)
          if [ -n "$base" ]; then
            git fetch origin "$base"
            git checkout -b "${{ steps.lane.outputs.branch }}" "origin/$base"
          else
            git checkout -b "${{ steps.lane.outputs.branch }}"
          fi

      - name: Acknowledge on the issue
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "**Agent started** (${{ steps.lane.outputs.model }}) — run $GITHUB_RUN_ID, branch \`${{ steps.lane.outputs.branch }}\`."

      - name: Run the session
        id: run
        run: |
          {
            echo "You are the only writer on this repository for this session. Repo: $GITHUB_REPOSITORY. Branch: ${{ steps.lane.outputs.branch }} (already checked out)."
            echo "Read AGENTS.md (or CLAUDE.md if AGENTS.md is absent) first and obey it."
            echo "YOUR TASK is the '# Dispatch comment' section at the end. The issue body is background only; do not carry out older tasks it describes."
            echo "Rules: never edit .github/workflows; do not open a PR; do not poll CI; stay inside the files the dispatch names; never deploy, never touch Azure/Cloudflare resources, never use eval()/Function() on user or template strings, never add a runtime call to SynthoDesk (DEC-066); run pnpm run typecheck and pnpm run test before you finish and fix what they report."
            echo "Your sandbox blocks child processes (EPERM) and writes to .git. A failure caused only by that is NOT a defect: never change code, tests or config to work around it; note it in the summary. The workflow commits your work and re-runs every check outside the sandbox after you finish."
            echo "Finish by writing reports/agent-summary.md: per item the root cause and the fix, test results, and anything left open. Do NOT state a commit SHA: you cannot run git here, and the workflow reports the real HEAD."
            echo
            echo "# Task issue #$ISSUE: $ISSUE_TITLE"
            echo
            printf '%s\n' "$ISSUE_BODY"
            echo
            echo "# Dispatch comment"
            echo
            printf '%s\n' "$GO_COMMENT"
          } > "$RUNNER_TEMP/prompt.md"
          mkdir -p reports
          rm -f reports/agent-summary.md

          next_lane() {
            case "$1" in
              codex) echo fast ;;
              fast) echo sol ;;
              sol) echo sol61 ;;
              sol61) echo astra ;;
              *) return 1 ;;
            esac
          }
          deployment_for() {
            case "$1" in
              codex) echo gpt-5-3-codex ;;
              fast) echo gpt-5-4 ;;
              sol) echo gpt-5-6-sol ;;
              sol61) echo gpt-6-1-sol ;;
              astra) echo gpt-6-astra ;;
              mini) echo gpt-5.4-mini ;;
            esac
          }
          run_codex() {
            local deployment=$1 prompt=$2 log=$3
            set +e
            codex exec --json --strict-config --skip-git-repo-check -m "$deployment" -s workspace-write -C "$GITHUB_WORKSPACE" - < "$prompt" 2>&1 | tee "$log" | tee -a "$RUNNER_TEMP/codex.log"
            local rc=${PIPESTATUS[0]}
            set -e
            return "$rc"
          }

          : > "$RUNNER_TEMP/codex.log"
          codex --version 2>&1 | tee -a "$RUNNER_TEMP/codex.log"
          active_lane=${{ steps.lane.outputs.lane }}
          active_model=${{ steps.lane.outputs.model }}
          if run_codex "$active_model" "$RUNNER_TEMP/prompt.md" "$RUNNER_TEMP/codex-main-1.jsonl"; then
            rc=0
          else
            rc=$?
            if tail -200 "$RUNNER_TEMP/codex-main-1.jsonl" | grep -qiE 'HTTP[^0-9]*429|status[^0-9]*429|RateLimit|rate[ -]?limit|quota'; then
              if fallback_lane=$(next_lane "$active_lane"); then
                fallback_model=$(deployment_for "$fallback_lane")
                gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "**Fallback:** $active_lane → $fallback_lane (429)"
                active_lane=$fallback_lane
                active_model=$fallback_model
                if run_codex "$active_model" "$RUNNER_TEMP/prompt.md" "$RUNNER_TEMP/codex-main-2.jsonl"; then rc=0; else rc=$?; fi
              fi
            fi
          fi
          echo "lane=$active_lane" >> "$GITHUB_OUTPUT"
          echo "model=$active_model" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Reinstall dependencies before verify
        if: always()
        run: pnpm install --frozen-lockfile

      - name: Verify outside the sandbox
        id: verify
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          { pnpm run typecheck && pnpm run test && { git fetch -q --depth=1 origin main && git diff --quiet FETCH_HEAD -- apps/web e2e packages || { pnpm --filter @nexus/e2e exec playwright install chromium && pnpm --filter @nexus/e2e exec playwright test --reporter=line; }; }; } 2>&1 | tee "$RUNNER_TEMP/verify.log"

      # AGENT_REPAIR_ROUND: one repair pass fed by the real (outside-sandbox) failure log.
      - name: Repair round (feed verify failures back to the agent)
        id: repair
        if: always() && steps.run.outcome == 'success' && steps.verify.outcome == 'failure'
        continue-on-error: true
        run: |
          {
            cat "$RUNNER_TEMP/prompt.md"
            echo
            echo "# Repair round"
            echo "Your earlier work for this task is already in the working tree. The workflow re-ran the checks OUTSIDE the sandbox and they FAILED."
            echo "Fix the cause in code or tests. Never skip, weaken or delete a test. Do not redo work that already passes. Last 150 lines of the real check:"
            echo '```'
            tail -150 "$RUNNER_TEMP/verify.log"
            echo '```'
          } > "$RUNNER_TEMP/repair.md"

          next_lane() {
            case "$1" in
              codex) echo fast ;;
              fast) echo sol ;;
              sol) echo sol61 ;;
              sol61) echo astra ;;
              *) return 1 ;;
            esac
          }
          deployment_for() {
            case "$1" in
              codex) echo gpt-5-3-codex ;;
              fast) echo gpt-5-4 ;;
              sol) echo gpt-5-6-sol ;;
              sol61) echo gpt-6-1-sol ;;
              astra) echo gpt-6-astra ;;
              mini) echo gpt-5.4-mini ;;
            esac
          }
          run_codex() {
            local deployment=$1 prompt=$2 log=$3
            set +e
            codex exec --json --strict-config --skip-git-repo-check -m "$deployment" -s workspace-write -C "$GITHUB_WORKSPACE" - < "$prompt" 2>&1 | tee "$log" | tee -a "$RUNNER_TEMP/codex.log"
            local rc=${PIPESTATUS[0]}
            set -e
            return "$rc"
          }

          echo "=== repair round ===" >> "$RUNNER_TEMP/codex.log"
          active_lane=${{ steps.run.outputs.lane }}
          active_model=${{ steps.run.outputs.model }}
          if run_codex "$active_model" "$RUNNER_TEMP/repair.md" "$RUNNER_TEMP/codex-repair-1.jsonl"; then
            rc=0
          else
            rc=$?
            if tail -200 "$RUNNER_TEMP/codex-repair-1.jsonl" | grep -qiE 'HTTP[^0-9]*429|status[^0-9]*429|RateLimit|rate[ -]?limit|quota'; then
              if fallback_lane=$(next_lane "$active_lane"); then
                fallback_model=$(deployment_for "$fallback_lane")
                gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "**Fallback:** $active_lane → $fallback_lane (429)"
                active_lane=$fallback_lane
                active_model=$fallback_model
                if run_codex "$active_model" "$RUNNER_TEMP/repair.md" "$RUNNER_TEMP/codex-repair-2.jsonl"; then rc=0; else rc=$?; fi
              fi
            fi
          fi
          echo "lane=$active_lane" >> "$GITHUB_OUTPUT"
          echo "model=$active_model" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Re-verify after repair
        id: verify2
        if: always() && steps.repair.outcome != 'skipped'
        continue-on-error: true
        run: |
          set -o pipefail
          { pnpm run typecheck && pnpm run test && { git fetch -q --depth=1 origin main && git diff --quiet FETCH_HEAD -- apps/web e2e packages || { pnpm --filter @nexus/e2e exec playwright install chromium && pnpm --filter @nexus/e2e exec playwright test --reporter=line; }; }; } 2>&1 | tee "$RUNNER_TEMP/verify.log"

      - name: Escalate after failed repair
        if: always() && steps.repair.outcome != 'skipped' && steps.verify2.outcome == 'failure'
        run: |
          if ! gh label list --repo "$GITHUB_REPOSITORY" --limit 1000 --json name --jq '.[].name' | grep -Fxq 'escalate:sol'; then
            gh label create 'escalate:sol' --repo "$GITHUB_REPOSITORY" --color D93F0B --description 'Repair verification failed; PM escalation required'
          fi
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label 'escalate:sol'

      - name: Commit leftovers and push
        id: push
        if: always()
        run: |
          git add -A && (git reset -q -- reports/agent-summary.md 2>/dev/null || true)
          git diff --cached --quiet || git commit -m "agent(#${ISSUE}): session work"
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
            echo "pushed=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git push -u origin "${{ steps.lane.outputs.branch }}"
          echo "pushed=yes" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report on the issue
        if: always()
        run: |
          model=${{ steps.repair.outputs.model }}
          if [ -z "$model" ]; then model=${{ steps.run.outputs.model }}; fi
          if [ -z "$model" ]; then model=${{ steps.lane.outputs.model }}; fi
          rounds=1
          if [ "${{ steps.repair.outcome }}" != "skipped" ]; then rounds=2; fi
          SECONDS=$(( $(date +%s) - $(cat "$RUNNER_TEMP/agent-started-at") ))
          minutes=$(( (SECONDS + 59) / 60 ))
          usage=$(node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = process.env.RUNNER_TEMP;
          let tokensIn = 0;
          let tokensOut = 0;
          let available = false;
          for (const name of fs.readdirSync(directory).filter((name) => /^codex-(main|repair)-\d+\.jsonl$/.test(name))) {
            for (const line of fs.readFileSync(path.join(directory, name), 'utf8').split(/\r?\n/)) {
              try {
                const event = JSON.parse(line);
                if (event.type !== 'turn.completed' || !event.usage) continue;
                const input = Number(event.usage.input_tokens);
                const output = Number(event.usage.output_tokens);
                if (!Number.isFinite(input) || !Number.isFinite(output)) continue;
                tokensIn += input;
                tokensOut += output;
                available = true;
              } catch {}
            }
          }
          process.stdout.write(available ? `${tokensIn} ${tokensOut}` : 'unavailable');
          NODE
          )
          if [ "$usage" = unavailable ]; then
            usage_line="**Usage:** model=$model tokens=unavailable minutes=$minutes rounds=$rounds"
          else
            read -r tokens_in tokens_out <<< "$usage"
            usage_line="**Usage:** model=$model tokens_in=$tokens_in tokens_out=$tokens_out minutes=$minutes rounds=$rounds"
          fi
          {
            if [ "${{ steps.push.outputs.pushed }}" = "yes" ] && [ "${{ steps.run.outcome }}" = "success" ] && [ "${{ (steps.verify.outcome == 'success' || steps.verify2.outcome == 'success') && 'success' || 'failure' }}" = "success" ]; then
              echo "**Agent finished** ($model) — run $GITHUB_RUN_ID · branch \`${{ steps.lane.outputs.branch }}\` · HEAD \`${{ steps.push.outputs.sha }}\`"
            elif [ "${{ steps.push.outputs.pushed }}" = "yes" ]; then
              echo "**Agent stopped with errors** ($model) — run $GITHUB_RUN_ID · branch \`${{ steps.lane.outputs.branch }}\` · HEAD \`${{ steps.push.outputs.sha }}\` — not eligible for auto-PR."
            else
              echo "**Agent produced no commits** ($model) — run $GITHUB_RUN_ID."
            fi
            echo "$usage_line"
            echo
            echo "**Verify outside the sandbox: ${{ (steps.verify.outcome == 'success' || steps.verify2.outcome == 'success') && 'success' || 'failure' }}** (pnpm run typecheck + pnpm run test + full Playwright e2e when apps/web, e2e or packages changed — mirrors ci.yml, last 15 lines)"
            echo '```'; tail -15 "$RUNNER_TEMP/verify.log" 2>/dev/null; echo '```'
            echo
            echo "Files changed vs main:"; echo '```'; git diff --stat origin/main...HEAD 2>/dev/null | tail -20; echo '```'
            echo
            if [ -f reports/agent-summary.md ]; then cat reports/agent-summary.md; else echo "_No reports/agent-summary.md written. Last 40 log lines:_"; echo '```'; tail -40 "$RUNNER_TEMP/codex.log" 2>/dev/null; echo '```'; fi
          } > "$RUNNER_TEMP/report.md"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"

      - name: Upload session log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ env.ISSUE }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/codex.log
            ${{ runner.temp }}/verify.log
            reports/agent-summary.md
          if-no-files-found: ignore
          retention-days: 14
